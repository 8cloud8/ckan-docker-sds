name: HealthDCAT-AP Tests

on:
  push:
    # branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    # Allow manual triggering

jobs:
  healthdcat-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Setup environment
      run: make patch

    - name: Start services (avoid rebuild when possible)
      run: |
        # Try to use existing images first to avoid unnecessary rebuilds
        docker compose pull --ignore-pull-failures || true
        docker compose up -d --no-build || {
          echo "Could not start with existing images, building..."
          docker compose build
          docker compose up -d
        }

    - name: Wait for CKAN to be ready
      run: |
        echo "Waiting for CKAN to be ready..."
        timeout 300 bash -c 'until curl -s -f http://localhost:5001/api/action/status_show > /dev/null; do sleep 5; echo "Waiting..."; done'

    - name: Test CKAN connectivity
      run: ./tests/curl_test_dataset.sh

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install uv
        uv sync --group dev

    - name: Run HealthDCAT-AP Tests
      run: |
        PYTHONPATH=tests/healthdcat uv run pytest --verbose tests/healthdcat

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: healthdcat-test-reports-${{ github.run_number }}
        path: tests/healthdcat/reports/
        retention-days: 30

    - name: Show logs on failure
      if: failure()
      run: |
        echo "=== Service Status ==="
        docker compose ps
        docker stats --no-stream || true
        echo "=== CKAN Logs ==="
        docker compose logs ckan --tail 50

    - name: Cleanup
      if: always()
      run: docker compose down --remove-orphans -v --rmi local

  test-results-summary:
    runs-on: ubuntu-latest
    needs: healthdcat-tests
    if: always()

    steps:
    - name: Download test artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: healthdcat-test-reports-*
        merge-multiple: true
        path: test-reports
      continue-on-error: true

    - name: Generate test summary
      run: |
        echo "## HealthDCAT-AP Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ -f "test-reports/healthdcat-test-report.json" ]; then
          python3 << 'EOF'
        import json
        import os

        try:
            with open('test-reports/healthdcat-test-report.json', 'r') as f:
                report = json.load(f)

            summary = report.get('summary', {})

            print("### Test Execution Results")
            print(f"- **Total Tests**: {summary.get('total', 0)}")
            print(f"- **Passed**: {summary.get('passed', 0)}")
            print(f"- **Failed**: {summary.get('failed', 0)}")
            print(f"- **Errors**: {summary.get('error', 0)}")
            print(f"- **Skipped**: {summary.get('skipped', 0)}")
            print(f"- **Duration**: {summary.get('duration', 0):.2f}s")
            print("")

            if summary.get('failed', 0) > 0 or summary.get('error', 0) > 0:
                print("### Test Issues Found")
                print("Check the detailed test reports for more information.")
            else:
                print("### All Tests Passed!")
                print("HealthDCAT-AP extension is working correctly.")

        except Exception as e:
            print(f"### Could not parse test results")
            print(f"Error: {e}")
        EOF
        else
          echo "### No detailed test results available" >> $GITHUB_STEP_SUMMARY
          echo "Tests may have failed to complete or generate reports." >> $GITHUB_STEP_SUMMARY
        fi >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Useful Links" >> $GITHUB_STEP_SUMMARY
        echo "- [HealthDCAT-AP Documentation](https://github.com/ckan/ckanext-dcat/blob/master/docs/healthdcat.md)" >> $GITHUB_STEP_SUMMARY
        echo "- [CKAN Documentation](https://docs.ckan.org/)" >> $GITHUB_STEP_SUMMARY
        echo "- [Test Artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
