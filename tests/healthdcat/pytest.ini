[pytest]
minversion = 6.0
testpaths = tests/healthdcat
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers --disable-warnings --html=reports/report.html --self-contained-html --json-report --json-report-file=reports/report.json
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    e2e: marks tests as end-to-end tests
    healthdcat: marks tests as HealthDCAT-AP specific tests
